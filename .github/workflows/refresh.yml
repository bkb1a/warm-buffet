name: Refresh dashboard

on:
  workflow_dispatch:        # de "▶ Nieuwe data" knop op GitHub
  schedule:
    - cron: "30 5 * * 1-5"  # elke weekdag 05:30 UTC (07:30 Brussel)

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests openpyxl yfinance

      - name: Backfill weekly prices + rebuild dashboard.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python backfill_prices.py
          python export_dashboard.py

      - name: Commit refreshed data
        run: |
          git config user.name "warm-buffet-bot"
          git config user.email "actions@github.com"
          git add data/dashboard.json
          git diff --cached --quiet || git commit -m "Refresh dashboard data ($(date -u +%F))"
          git push
